# ================================================================
# TERAFORT ANALYTICS — dbt PACKAGE DEPENDENCIES
# ================================================================
# Run `dbt deps` after editing this file to install/update.
# GitHub Actions runs `dbt deps` automatically on every workflow.
# ================================================================

packages:

  # ─── dbt_utils ─────────────────────────────────────────────
  # The "standard library" of dbt. Provides:
  #   - generate_surrogate_key()   (hash-based unique IDs)
  #   - star()                     (SELECT * with column exclusion)
  #   - pivot() / unpivot()
  #   - safe_subtract / safe_divide
  #   - Generic tests (equal_rowcount, recency, etc.)
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]

  # ─── dbt_expectations ──────────────────────────────────────
  # Port of Great Expectations for dbt. Provides advanced data
  # quality tests like:
  #   - expect_column_values_to_be_between
  #   - expect_column_values_to_match_regex
  #   - expect_table_row_count_to_be_between
  # Note: package was renamed from calogica → metaplane in 2025
  - package: metaplane/dbt_expectations
    version: [">=0.10.0", "<0.11.0"]

  # ─── elementary ────────────────────────────────────────────
  # Observability + monitoring + anomaly detection.
  # Creates its own schema (`<target>_elementary`) to log:
  #   - All test results (pass/fail history)
  #   - Model run times + row counts
  #   - Source freshness checks
  #   - Anomaly detection on metrics
  # The HTML dashboard is generated by the `edr` CLI.
  - package: elementary-data/elementary
    version: [">=0.23.0", "<0.24.0"]

  # ─── codegen (optional but useful) ─────────────────────────
  # Auto-generates source YAML and base model SQL from existing
  # BigQuery tables. Saves hours of typing for 13 platforms.
  #   dbt run-operation generate_source --args '{schema_name: Admob}'
  - package: dbt-labs/codegen
    version: [">=0.14.0", "<0.15.0"]
